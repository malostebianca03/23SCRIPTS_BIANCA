    <!DOCTYPE html>
    <html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Decrescente:</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: Arial, Helvetica, sans-serif;
                background: linear-gradient(135deg, #4b4b4e, #000000);
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
            }

            .crime{
                background: #fff;
                width: 400px;
                padding: 35px;
                border-radius: 20px;
                box-shadow: 0 10px 25px rgba(0, 0, 0, .4);
                text-align: center;
            }

            h2 {
                margin-bottom: 25px;
                color: #333;
            }

            label {
                display: block;
                text-align: left;
                margin-bottom: 8px;
                font-weight: bold;
                color: #555;
            }

            input {
                width: 100%;
                padding: 12px;
                margin-bottom: 18px;
                border: 2px solid #ddd;
                border-radius: 10px;
                font-size: 16px;
                outline: none;
            }

            input:focus {
                border-color: #47474b;
            }

            button {
                width: 100%;
                padding: 12px;
                background: #48494b;
                color: #fff;
                border: none;
                border-radius: 10px;
                font-size: 18px;
                cursor: pointer;
                transition: .3s;
            }

            button:hover {
                background: #000000;
                transform: scale(1.03);
            }
        </style>
      
</html>
<script type="text/javascript">
    function investigar() {

        var contador = 0;

        var r1 = prompt("Telefonou para a vítima? (S/N)");
        var r2 = prompt("Esteve no local do crime? (S/N)");
        var r3 = prompt("Mora perto da vítima? (S/N)");
        var r4 = prompt("Devia para a vítima? (S/N)");
        var r5 = prompt("Já trabalhou com a vítima? (S/N)");

        if (r1.toUpperCase() == "S") contador++;
        if (r2.toUpperCase() == "S") contador++;
        if (r3.toUpperCase() == "S") contador++;
        if (r4.toUpperCase() == "S") contador++;
        if (r5.toUpperCase() == "S") contador++;

        var classificacao;

        if (contador == 2) {
            classificacao = "Suspeita";
        } else if (contador == 3 || contador == 4) {
            classificacao = "Cúmplice";
        } else if (contador == 5) {
            classificacao = "Assassino";
        } else {
            classificacao = "Inocente";
        }

        alert("Classificação: " + classificacao);
    }
</script>

</head>

<body>
    <div class="crime">

        <h2>Investigação Criminal</h2>
    
        <button onclick="investigar()">Iniciar Questionário</button>
    </div>

</body>

</html>
