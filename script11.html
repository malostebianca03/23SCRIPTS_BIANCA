<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>script 11:</title>
    <!DOCTYPE html>
    <html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Decrescente:</title>

        <style>
            *{
                margin:0;
                padding:0;
                box-sizing:border-box;
            }
            
            body{
                font-family: Arial, Helvetica, sans-serif;
                background: linear-gradient(135deg, #4b4b4e, #000000);
                display:flex;
                justify-content:center;
                align-items:center;
                height:100vh;
            }
            
            .aluno{
                background:#fff;
                width:400px;
                padding:35px;
                border-radius:20px;
                box-shadow:0 10px 25px rgba(0,0,0,.4);
                text-align:center;
            }
            
            h2{
                margin-bottom:25px;
                color:#333;
            }
            
            label{
                display:block;
                text-align:left;
                margin-bottom:8px;
                font-weight:bold;
                color:#555;
            }
            
            input{
                width:100%;
                padding:12px;
                margin-bottom:18px;
                border:2px solid #ddd;
                border-radius:10px;
                font-size:16px;
                outline:none;
            }
            
            input:focus{
                border-color:#47474b;
            }
            
            button{
                width:100%;
                padding:12px;
                background:#48494b;
                color:#fff;
                border:none;
                border-radius:10px;
                font-size:18px;
                cursor:pointer;
                transition:.3s;
            }
            
            button:hover{
                background:#000000;
                transform:scale(1.03);
            }
            
            
            </style>


    </html>
    <script type="text/javascript">
        function calcular() {

            var nota1 = parseFloat(prompt("Digite a primeira nota:"));
            var nota2 = parseFloat(prompt("Digite a segunda nota:"));

            var media = (nota1 + nota2) / 2;
            var conceito = "";
            var situacao = "";

            if (media >= 9 && media <= 10) {
                conceito = "A";
            } else if (media >= 7.5) {
                conceito = "B";
            } else if (media >= 6) {
                conceito = "C";
            } else if (media >= 4) {
                conceito = "D";
            } else {
                conceito = "E";
            }

            if (conceito == "A" || conceito == "B" || conceito == "C") {
                situacao = "APROVADO";
            } else {
                situacao = "REPROVADO";
            }

            alert(
                "Nota 1: " + nota1 +
                "\nNota 2: " + nota2 +
                "\nMédia: " + media.toFixed(2) +
                "\nConceito: " + conceito +
                "\nSituação: " + situacao
            );
        }
    </script>

</head>

<body>
    <div class="aluno">

        <h2>Média do Aluno</h2>
    
        <button onclick="calcular()">Calcular</button>
    </div>

</body>

</html>
