    <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decrescente:</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        
        body{
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #4b4b4e, #000000);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }
        
        .hora{
            background:#fff;
            width:400px;
            padding:35px;
            border-radius:20px;
            box-shadow:0 10px 25px rgba(0,0,0,.4);
            text-align:center;
        }
        
        h2{
            margin-bottom:25px;
            color:#333;
        }
        
        label{
            display:block;
            text-align:left;
            margin-bottom:8px;
            font-weight:bold;
            color:#555;
        }
        
        input{
            width:100%;
            padding:12px;
            margin-bottom:18px;
            border:2px solid #ddd;
            border-radius:10px;
            font-size:16px;
            outline:none;
        }
        
        input:focus{
            border-color:#47474b;
        }
        
        button{
            width:100%;
            padding:12px;
            background:#48494b;
            color:#fff;
            border:none;
            border-radius:10px;
            font-size:18px;
            cursor:pointer;
            transition:.3s;
        }
        
        button:hover{
            background:#000000;
            transform:scale(1.03);
        }
      
        
        </style>
   
</html>
    <script type="text/javascript">
        function calcular() {

            var valorHora = parseFloat(prompt("Valor da hora:"));
            var horas = parseFloat(prompt("Horas trabalhadas:"));

            var salarioBruto = valorHora * horas;

            var ir = 0;

            if (salarioBruto <= 2112) {
                ir = 0;
            } else if (salarioBruto <= 2826.65) {
                ir = salarioBruto * 0.075;
            } else if (salarioBruto <= 3751.05) {
                ir = salarioBruto * 0.15;
            } else if (salarioBruto <= 4664.68) {
                ir = salarioBruto * 0.225;
            } else {
                ir = salarioBruto * 0.275;
            }

            var sindicato = salarioBruto * 0.03;
            var fgts = salarioBruto * 0.11;

            var total = ir + sindicato;
            var liquido = salarioBruto - total;

            document.write(`
                <h2>Folha de Pagamento</h2>
                <table border="1" cellpadding="8">
                    <tr><td>Salário Bruto</td><td>R$ ${salarioBruto.toFixed(2)}</td></tr>
                    <tr><td>IR</td><td>R$ ${ir.toFixed(2)}</td></tr>
                    <tr><td>Sindicato (3%)</td><td>R$ ${sindicato.toFixed(2)}</td></tr>
                    <tr><td>FGTS (11%)</td><td>R$ ${fgts.toFixed(2)}</td></tr>
                    <tr><td>Total Descontos</td><td>R$ ${total.toFixed(2)}</td></tr>
                    <tr><td><b>Líquido</b></td><td><b>R$ ${liquido.toFixed(2)}</b></td></tr>
                </table>
            `);
        }
    </script>
        

</head>
<body>
    <body>
        <div class="hora">

            <h2>Folha de Pagamento</h2>
        
            <button onclick="calcular()">Calcular</button>
            
        </div>
      
    </body>
</body>
</html>
