    <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decrescente:</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        
        body{
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #4b4b4e, #000000);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }
        
        .triangulo{
            background:#fff;
            width:400px;
            padding:35px;
            border-radius:20px;
            box-shadow:0 10px 25px rgba(0,0,0,.4);
            text-align:center;
        }
        
        h2{
            margin-bottom:25px;
            color:#333;
        }
        
        label{
            display:block;
            text-align:left;
            margin-bottom:8px;
            font-weight:bold;
            color:#555;
        }
        
        input{
            width:100%;
            padding:12px;
            margin-bottom:18px;
            border:2px solid #ddd;
            border-radius:10px;
            font-size:16px;
            outline:none;
        }
        
        input:focus{
            border-color:#47474b;
        }
        
        button{
            width:100%;
            padding:12px;
            background:#48494b;
            color:#fff;
            border:none;
            border-radius:10px;
            font-size:18px;
            cursor:pointer;
            transition:.3s;
        }
        
        button:hover{
            background:#000000;
            transform:scale(1.03);
        }
        
        
        </style>

</body>
</html>
    <script type="text/javascript">
        function verificarTriangulo() {

            var a = parseFloat(prompt("Digite o primeiro lado:"));
            var b = parseFloat(prompt("Digite o segundo lado:"));
            var c = parseFloat(prompt("Digite o terceiro lado:"));

        
            if (a + b > c && a + c > b && b + c > a) {

                if (a == b && b == c) {
                    alert("Triângulo Equilátero");
                } else if (a == b || a == c || b == c) {
                    alert("Triângulo Isósceles");
                } else {
                    alert("Triângulo Escaleno");
                }

            } else {
                alert("Os valores não formam um triângulo");
            }
        }
    </script>

</head>

<body>
    <div class="triangulo">

        <h2>Verificação do Triângulo</h2>
    
        <button onclick="verificarTriangulo()">Verificar</button>
    </div>

</body>
</html>
