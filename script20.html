    <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decrescente:</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        
        body{
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #4b4b4e, #000000);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }
        
        .simples{
            background:#fff;
            width:400px;
            padding:35px;
            border-radius:20px;
            box-shadow:0 10px 25px rgba(0,0,0,.4);
            text-align:center;
        }
        
        h2{
            margin-bottom:25px;
            color:#333;
        }
        
        label{
            display:block;
            text-align:left;
            margin-bottom:8px;
            font-weight:bold;
            color:#555;
        }
        
        input{
            width:100%;
            padding:12px;
            margin-bottom:18px;
            border:2px solid #ddd;
            border-radius:10px;
            font-size:16px;
            outline:none;
        }
        
        input:focus{
            border-color:#47474b;
        }
        
        button{
            width:100%;
            padding:12px;
            background:#48494b;
            color:#fff;
            border:none;
            border-radius:10px;
            font-size:18px;
            cursor:pointer;
            transition:.3s;
        }
        
        button:hover{
            background:#000000;
            transform:scale(1.03);
        }
        
        
        </style>
</html>
    <script type="text/javascript">
        function calcular() {

            var n1 = parseFloat(prompt("Digite o primeiro número:"));
            var n2 = parseFloat(prompt("Digite o segundo número:"));

            var op = prompt("Escolha a operação:\n+ soma\n- subtração\n* multiplicação\n/ divisão");

            var resultado;

            if (op == "+") {
                resultado = n1 + n2;
            } else if (op == "-") {
                resultado = n1 - n2;
            } else if (op == "*") {
                resultado = n1 * n2;
            } else if (op == "/") {
                resultado = n1 / n2;
            } else {
                alert("Operação inválida!");
                return;
            }

            // Verificações
            var parOuImpar = (resultado % 2 == 0) ? "Par" : "Ímpar";

            var positivoOuNegativo = (resultado >= 0) ? "Positivo" : "Negativo";

            var inteiroOuDecimal = (resultado == Math.floor(resultado)) ? "Inteiro" : "Decimal";

            alert(
                "Resultado: " + resultado +
                "\n" + parOuImpar +
                "\n" + positivoOuNegativo +
                "\n" + inteiroOuDecimal
            );
        }
    </script>

</head>

<body>
     <div class="simples">

         <h2>Calculadora Simples</h2>
     
         <button onclick="calcular()">Executar</button>
     </div>

</body>
</html>
