<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maior de Três Números</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }
    
    body{
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #4b4b4e, #000000);
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }
    
    .tres{
        background:#fff;
        width:400px;
        padding:35px;
        border-radius:20px;
        box-shadow:0 10px 25px rgba(0,0,0,.4);
        text-align:center;
    }
    
    h2{
        margin-bottom:25px;
        color:#333;
    }
    
    label{
        display:block;
        text-align:left;
        margin-bottom:8px;
        font-weight:bold;
        color:#555;
    }
    
    input{
        width:100%;
        padding:12px;
        margin-bottom:18px;
        border:2px solid #ddd;
        border-radius:10px;
        font-size:16px;
        outline:none;
    }
    
    input:focus{
        border-color:#47474b;
    }
    
    button{
        width:100%;
        padding:12px;
        background:#48494b;
        color:#fff;
        border:none;
        border-radius:10px;
        font-size:18px;
        cursor:pointer;
        transition:.3s;
    }
    
    button:hover{
        background:#000000;
        transform:scale(1.03);
    }
    
    
    </style>

<script>
function verificar() {
    var num1 = parseInt(document.getElementById("num1").value);
    var num2 = parseInt(document.getElementById("num2").value);
    var num3 = parseInt(document.getElementById("num3").value);

    if (isNaN(num1) || isNaN(num2) || isNaN(num3)) {
        alert("Preencha os três números.");
        return;
    }

    var maior = num1;

    if (num2 > maior) {
        maior = num2;
    }

    if (num3 > maior) {
        maior = num3;
    }

    alert("O maior número é: " + maior);
}
</script>

</head>
<body>

<div class="tres">
    <h2>Maior de Três Números</h2>

    <label for="num1">Número 1</label>
    <input type="number" id="num1" placeholder="Digite o primeiro número">

    <label for="num2">Número 2</label>
    <input type="number" id="num2" placeholder="Digite o segundo número">

    <label for="num3">Número 3</label>
    <input type="number" id="num3" placeholder="Digite o terceiro número">

    <button onclick="verificar()">Verificar</button>
</div>

</body>
</html>
