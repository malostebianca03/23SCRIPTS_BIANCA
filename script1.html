<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vogal ou Consoante</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #4b4b4e, #000000);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.digitar{
    background:#fff;
    width:380px;
    padding:35px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    text-align:center;
}

h2{
    color:#333;
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:10px;
    color:#555;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:2px solid #ddd;
    border-radius:10px;
    font-size:18px;
    text-align:center;
    margin-bottom:20px;
    outline:none;
}

input:focus{
    border-color:#47474b;
}

button{
    width:100%;
    padding:12px;
    background:#48494b;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#000000;
    transform:scale(1.03);
}


</style>

<script>
function verificar() {
    var letra = document.getElementById("letra").value.toLowerCase();

    if (letra == "a" || letra == "e" || letra == "i" || letra == "o" || letra == "u") {
        alert("A letra é uma vogal.");
    } else {
        alert("A letra é uma consoante.");
    }
}
</script>

</head>
<body>

<div class="digitar">
    <h2>Vogal ou Consoante</h2>

    <label for="letra">Digite uma letra:</label>

    <input type="text" id="letra" maxlength="1" >

    <button onclick="verificar()">Verificar</button>
</div>

</body>
</html>
