<!DOCTYPE html>
<html lang="pt-br">
<head>

    <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decrescente:</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        
        body{
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #4b4b4e, #000000);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }
        
        .reajuste{
            background:#fff;
            width:400px;
            padding:35px;
            border-radius:20px;
            box-shadow:0 10px 25px rgba(0,0,0,.4);
            text-align:center;
        }
        
        h2{
            margin-bottom:25px;
            color:#333;
        }
        
        label{
            display:block;
            text-align:left;
            margin-bottom:8px;
            font-weight:bold;
            color:#555;
        }
        
        input{
            width:100%;
            padding:12px;
            margin-bottom:18px;
            border:2px solid #ddd;
            border-radius:10px;
            font-size:16px;
            outline:none;
        }
        
        input:focus{
            border-color:#47474b;
        }
        
        button{
            width:100%;
            padding:12px;
            background:#48494b;
            color:#fff;
            border:none;
            border-radius:10px;
            font-size:18px;
            cursor:pointer;
            transition:.3s;
        }
        
        button:hover{
            background:#000000;
            transform:scale(1.03);
        }
    
    
       </style>
 
</html>
    <script type="text/javascript">
        function calcularAumento() {
            var salario = parseFloat(prompt("Digite o salário do colaborador:"));

            var percentual = 0;

            if (salario <= 1480) {
                percentual = 0.20;
            } else if (salario <= 1900) {
                percentual = 0.15;
            } else if (salario <= 2500) {
                percentual = 0.10;
            } else {
                percentual = 0.05;
            }

            var aumento = salario * percentual;
            var novoSalario = salario + aumento;

            alert(
                "Salário antes do reajuste: R$ " + salario.toFixed(2) +
                "\nPercentual de aumento: " + (percentual * 100) + "%" +
                "\nValor do aumento: R$ " + aumento.toFixed(2) +
                "\nNovo salário: R$ " + novoSalario.toFixed(2)
            );
        }
    </script>

</head>
<body>
    <div class="reajuste">

        <h2>Reajuste Salarial - Organizações Tabajara</h2>
    
        <button onclick="calcularAumento()">Calcular Reajuste</button>
    </div>

</body>
</html>
