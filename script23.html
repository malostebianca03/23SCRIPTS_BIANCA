<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>script 23:</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        
        body{
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #4b4b4e, #000000);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }
        
        .fruta{
            background:#fff;
            width:400px;
            padding:35px;
            border-radius:20px;
            box-shadow:0 10px 25px rgba(0,0,0,.4);
            text-align:center;
        }
        
        h2{
            margin-bottom:25px;
            color:#333;
        }
        
        label{
            display:block;
            text-align:left;
            margin-bottom:8px;
            font-weight:bold;
            color:#555;
        }
        
        input{
            width:100%;
            padding:12px;
            margin-bottom:18px;
            border:2px solid #ddd;
            border-radius:10px;
            font-size:16px;
            outline:none;
        }
        
        input:focus{
            border-color:#47474b;
        }
        
        button{
            width:100%;
            padding:12px;
            background:#48494b;
            color:#fff;
            border:none;
            border-radius:10px;
            font-size:18px;
            cursor:pointer;
            transition:.3s;
        }
        
        button:hover{
            background:#000000;
            transform:scale(1.03);
        }
        
        
        </style>
    <script type="text/javascript">
    
        function calcularPreço() {

            var morango = parseFloat(prompt("Quantidade de morangos (kg):"));
            var maca = parseFloat(prompt("Quantidade de maçãs (kg):"));

            var precoMorango = 0;
            var precoMaca = 0;

          
            if (morango <= 5) {
                precoMorango = 24.00;
            } else {
                precoMorango = 20.00;
            }

            
            if (maca <= 5) {
                precoMaca = 14.80;
            } else {
                precoMaca = 12.40;
            }

            var totalMorango = morango * precoMorango;
            var totalMaca = maca * precoMaca;

            var total = totalMorango + totalMaca;

            var totalKg = morango + maca;

           
            if (totalKg > 12 || total > 180) {
                total = total * 0.90;
            }

            alert(
                "Total de morangos: R$ " + totalMorango.toFixed(2) +
                "\nTotal de maçãs: R$ " + totalMaca.toFixed(2) +
                "\nTotal da compra: R$ " + total.toFixed(2)
            );
        }
    </script>

</head>

<body>
    <div class="fruta">

        <h2>Frutaria</h2>
    
        <button onclick="calcularPreço()">Calcular Compra</button>
    </div>

</body>
</html>
