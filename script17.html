    <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decrescente:</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        
        body{
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #4b4b4e, #000000);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }
        
        .numero{
            background:#fff;
            width:400px;
            padding:35px;
            border-radius:20px;
            box-shadow:0 10px 25px rgba(0,0,0,.4);
            text-align:center;
        }
        
        h2{
            margin-bottom:25px;
            color:#333;
        }
        
        label{
            display:block;
            text-align:left;
            margin-bottom:8px;
            font-weight:bold;
            color:#555;
        }
        
        input{
            width:100%;
            padding:12px;
            margin-bottom:18px;
            border:2px solid #ddd;
            border-radius:10px;
            font-size:16px;
            outline:none;
        }
        
        input:focus{
            border-color:#47474b;
        }
        
        button{
            width:100%;
            padding:12px;
            background:#48494b;
            color:#fff;
            border:none;
            border-radius:10px;
            font-size:18px;
            cursor:pointer;
            transition:.3s;
        }
        
        button:hover{
            background:#000000;
            transform:scale(1.03);
        }
        
        
        </style>
  
</html>
    <script type="text/javascript">
        function decomporNumero() {

            var numero = parseInt(prompt("Digite um número inteiro menor que 1000:"));

            if (numero < 0 || numero >= 1000) {
                alert("Número inválido! Deve ser entre 0 e 999.");
                return;
            }

            var centenas = Math.floor(numero / 100);
            var dezenas = Math.floor((numero % 100) / 10);
            var unidades = numero % 10;

            var resultado = "";

        
            if (centenas == 1) {
                resultado += "1 centena";
            } else if (centenas > 1) {
                resultado += centenas + " centenas";
            }

          
            if (dezenas > 0) {
                if (resultado != "") resultado += ", ";

                if (dezenas == 1) {
                    resultado += "1 dezena";
                } else {
                    resultado += dezenas + " dezenas";
                }
            }

            if (unidades > 0) {
                if (resultado != "") resultado += " e ";

                if (unidades == 1) {
                    resultado += "1 unidade";
                } else {
                    resultado += unidades + " unidades";
                }
            }

            if (resultado == "") {
                resultado = "0";
            }

            alert(numero + " = " + resultado);
        }
    </script>

</head>

<body>
 <div class="numero">

     <h2>Decomposição de Número</h2>
 
     <button onclick="decomporNumero()">Verificar</button>
 </div>

</body>
</html>
