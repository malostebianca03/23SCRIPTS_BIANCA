    <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decrescente:</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        
        body{
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #4b4b4e, #000000);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }
        
        .data{
            background:#fff;
            width:400px;
            padding:35px;
            border-radius:20px;
            box-shadow:0 10px 25px rgba(0,0,0,.4);
            text-align:center;
        }
        
        h2{
            margin-bottom:25px;
            color:#333;
        }
        
        label{
            display:block;
            text-align:left;
            margin-bottom:8px;
            font-weight:bold;
            color:#555;
        }
        
        input{
            width:100%;
            padding:12px;
            margin-bottom:18px;
            border:2px solid #ddd;
            border-radius:10px;
            font-size:16px;
            outline:none;
        }
        
        input:focus{
            border-color:#47474b;
        }
        
        button{
            width:100%;
            padding:12px;
            background:#48494b;
            color:#fff;
            border:none;
            border-radius:10px;
            font-size:18px;
            cursor:pointer;
            transition:.3s;
        }
        
        button:hover{
            background:#000000;
            transform:scale(1.03);
        }
        
        
        </style>
    
</html>
  <script type="text/javascript">
        function verificarData() {

            var data = prompt("Digite uma data no formato dd/mm/aaaa:");

            var partes = data.split("/");

            var dia = parseInt(partes[0]);
            var mes = parseInt(partes[1]);
            var ano = parseInt(partes[2]);

            var meses = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

            if ((ano % 4 == 0 && ano % 100 != 0) || (ano % 400 == 0)) {
                meses[1] = 29;
            }

            var valida = true;

          
            if (mes < 1 || mes > 12) {
                valida = false;
            }

            if (dia < 1 || dia > meses[mes - 1]) {
                valida = false;
            }

            if (valida) {
                alert("Data válida!");
            } else {
                alert("Data inválida!");
            }
        }
    </script>

</head>

<body>
    <div class="data">

        <h2>Validação de Data</h2>
    
        <button onclick="verificarData()">Verificar</button>
    </div>

</body>
</html>
